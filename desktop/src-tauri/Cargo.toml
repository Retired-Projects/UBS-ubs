[package]
name = "ubs-desktop"
version = "3.11.2"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Lightweight desktop control surface for Universal Build Script"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
# 계측(analytics-core) 전송. native-tls 만 켠다 — ureq 전역 헬퍼 대신 provider 명시 agent 를 쓴다.
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "3.3", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
